<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">실거래 전 안전 체크</title>
  <desc id="desc">자동매매 실주문 전 확인해야 할 항목을 정리한 이미지</desc>
  <rect width="1200" height="675" fill="#f9fafb"/>
  <text x="80" y="95" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#111827">실거래 전 안전 체크</text>
  <text x="82" y="135" font-family="Arial, sans-serif" font-size="22" fill="#4b5563">하락률 조건은 신호일 뿐, 바로 주문으로 연결하지 않습니다.</text>
  <g transform="translate(80 200)">
    <rect width="1040" height="350" rx="22" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <g font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">
      <circle cx="70" cy="72" r="22" fill="#dcfce7"/><text x="62" y="81" fill="#166534">1</text><text x="115" y="82">매수 가능 금액 확인</text>
      <circle cx="70" cy="145" r="22" fill="#dbeafe"/><text x="62" y="154" fill="#1d4ed8">2</text><text x="115" y="155">미체결 주문 확인</text>
      <circle cx="70" cy="218" r="22" fill="#fef3c7"/><text x="62" y="227" fill="#92400e">3</text><text x="115" y="228">장 시간과 거래량 확인</text>
      <circle cx="70" cy="291" r="22" fill="#fee2e2"/><text x="62" y="300" fill="#991b1b">4</text><text x="115" y="301">dry-run 결과 먼저 확인</text>
    </g>
    <g transform="translate(620 74)">
      <rect x="0" y="0" width="340" height="195" rx="18" fill="#f1f5f9"/>
      <text x="34" y="58" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">원칙</text>
      <text x="34" y="107" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#334155">신호 판단</text>
      <text x="34" y="146" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#334155">→ 가상 체결</text>
      <text x="34" y="185" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#334155">→ 실주문 검토</text>
    </g>
  </g>
  <text x="80" y="620" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#b91c1c">기본값은 dry_run=True</text>
</svg>
