<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">토스증권 Open API 6편 대표 이미지</title>
  <desc id="desc">현재가와 전일 종가를 비교해 하락률을 계산하는 Python 자동매매 개발 글 대표 이미지</desc>
  <rect width="1200" height="675" fill="#f7f9fb"/>
  <rect x="70" y="70" width="1060" height="535" rx="20" fill="#ffffff" stroke="#d8e0e8" stroke-width="2"/>
  <text x="110" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">토스증권 Open API 시작하기 (6)</text>
  <text x="110" y="208" font-family="Arial, sans-serif" font-size="50" font-weight="800" fill="#111827">캔들 데이터로</text>
  <text x="110" y="270" font-family="Arial, sans-serif" font-size="50" font-weight="800" fill="#111827">전일 대비</text>
  <text x="110" y="332" font-family="Arial, sans-serif" font-size="50" font-weight="800" fill="#111827">하락률 계산</text>
  <text x="114" y="383" font-family="Arial, sans-serif" font-size="23" fill="#4b5563">현재가 + 일봉 캔들 + 전일 종가 기준</text>
  <g transform="translate(785 150)">
    <rect x="0" y="0" width="275" height="275" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <line x1="46" y1="218" x2="242" y2="218" stroke="#94a3b8" stroke-width="3"/>
    <line x1="46" y1="46" x2="46" y2="218" stroke="#94a3b8" stroke-width="3"/>
    <rect x="80" y="100" width="32" height="88" rx="7" fill="#2563eb"/>
    <line x1="96" y1="68" x2="96" y2="206" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <rect x="142" y="136" width="32" height="58" rx="7" fill="#ef4444"/>
    <line x1="158" y1="104" x2="158" y2="210" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    <path d="M75 86 C112 64 148 76 188 118 C207 138 223 146 240 150" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
    <text x="45" y="251" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">현재가 vs 전일 종가</text>
  </g>
  <g transform="translate(110 440)">
    <rect x="0" y="0" width="220" height="72" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="28" y="44" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#155e75">현재가 조회</text>
    <path d="M235 36 L285 36" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M285 36 L270 24 M285 36 L270 48" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <rect x="305" y="0" width="220" height="72" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="338" y="44" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#166534">일봉 조회</text>
    <path d="M540 36 L590 36" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M590 36 L575 24 M590 36 L575 48" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <rect x="610" y="0" width="260" height="72" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="645" y="44" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#9a3412">하락률 계산</text>
  </g>
